# CARLA UE5 scalability groups.
#
# One bucket per tier in every group: @0 Low, @1 Medium, @2 High, @3 Epic.
# `CarlaDeviceProfileSelectorModule` (`LoadingPhase=PostConfigInit`) maps
# `-quality-level=<Tier>` to the matching bucket of every group at startup and
# re-applies it on `FCoreDelegates::OnPostEngineInit`, so a persisted
# GameUserSettings.ini cannot shadow the active tier.
#
# Epic (@3) is the reference: it reproduces the effective Epic configuration
# of `ue58-dev`. Values here apply at ECVF_SetByScalability, which loses to
# project-setting and system-settings pins in DefaultEngine.ini. CVars that
# tiers must change but DefaultEngine.ini pins (GI / reflection method, texture
# pool, capture resolution) are lowered by the selector module instead.
#
# Nothing is dispatched at runtime via `GEngine->Exec()`, which previously
# triggered NVIDIA Xid 109 GR CTX SWITCH TIMEOUT on Blackwell + driver 590.48.

; ==========================================================================
; ViewDistanceQuality
; Skeletal mesh LOD bias stays at 0/1 so vehicles and pedestrians keep their
; identifying detail on every tier. The view distance scale is 1.0 on every
; tier: distant vehicles, pedestrians and signals must not disappear early in
; a simulator, and lowering it saved only about 20 MiB.
; ==========================================================================
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=1.0

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0

; ==========================================================================
; AntiAliasingQuality
; r.AntiAliasingMethod is not ECVF_Scalability: Epic keeps the engine default
; (TSR) and the Low / Medium tiers switch to TAA in the selector module.
; ==========================================================================
[AntiAliasingQuality@0]
r.FXAA.Quality=0
r.TemporalAA.Quality=2

[AntiAliasingQuality@1]
r.FXAA.Quality=2
r.TemporalAA.Quality=2

[AntiAliasingQuality@2]
r.FXAA.Quality=4
r.TSR.History.UpdateQuality=2
r.TSR.RejectionAntiAliasingQuality=2

[AntiAliasingQuality@3]
r.FXAA.Quality=5
r.TemporalAA.Quality=3
r.TSR.History.UpdateQuality=3
r.TSR.RejectionAntiAliasingQuality=3

; ==========================================================================
; ShadowQuality
; Virtual shadow maps are on for every tier (DefaultEngine.ini). The tiers
; differ in physical page budget and clipmap resolution bias; the legacy
; CSM keys only matter for lights that do not use VSM.
; ==========================================================================
[ShadowQuality@0]
r.LightMaxDrawDistanceScale=1.0
r.LightFunctionQuality=0
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=512
r.Shadow.Virtual.MaxPhysicalPages=3072
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.0
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0

[ShadowQuality@1]
r.LightMaxDrawDistanceScale=1.0
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0

[ShadowQuality@2]
r.LightFunctionQuality=1
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=2048
r.Shadow.Virtual.MaxPhysicalPages=6144
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.5
r.DistanceFieldShadowing=1
r.DistanceFieldAO=0

[ShadowQuality@3]
r.LightFunctionQuality=1
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=10
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=4096
r.Shadow.Virtual.MaxPhysicalPages=8192
r.DistanceFieldShadowing=1
r.DistanceFieldAO=0

; ==========================================================================
; GlobalIlluminationQuality (Lumen)
; Low and Medium run without dynamic GI (r.DynamicGlobalIlluminationMethod=0
; from the selector module); the Lumen keys below only matter if it is
; re-enabled by hand. High and Epic use Lumen.
; ==========================================================================
[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.TranslucencyVolume.GridPixelSize=64
r.LumenScene.SurfaceCache.AtlasSize=2048

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.TraceMeshSDFs.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=4
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.TranslucencyVolume.GridPixelSize=32
r.LumenScene.SurfaceCache.AtlasSize=4096

; ==========================================================================
; ReflectionQuality
; Low and Medium use screen-space reflections plus reflection captures
; (r.ReflectionMethod=2 from the selector module). High and Epic use Lumen
; reflections.
; ==========================================================================
[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=4

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0
r.SSR.Quality=4

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxBounces=1
r.Lumen.Reflections.RoughnessFadeLength=0.25
r.Lumen.Reflections.SurfaceCacheFeedback=1
r.SSR.Quality=2

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxBounces=2
r.Lumen.Reflections.RoughnessFadeLength=0.25
r.Lumen.Reflections.SurfaceCacheFeedback=1
r.SSR.Quality=3

