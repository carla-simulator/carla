; ==========================================================================
; TextureQuality
; r.Streaming.PoolSize is pinned in DefaultEngine.ini (Epic value) and lowered
; for Low / Medium by the selector module.
; ==========================================================================
[TextureQuality@0]
r.Streaming.MipBias=0.5
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4

[TextureQuality@1]
r.Streaming.MipBias=0.5
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=4

[TextureQuality@2]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
r.Streaming.AmortizeCPUToGPUCopy=1

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
r.Streaming.AmortizeCPUToGPUCopy=1

