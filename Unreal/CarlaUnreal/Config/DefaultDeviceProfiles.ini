+CVars=("r.TSR.History.ScreenPercentage=150")
+CVars=("r.Nanite.Streaming.PoolSize=256")
+CVars=("r.AntiAliasingMethod=4")
+CVars=("r.ReflectionCaptureResolution=256")
+CVars=("r.MegaLights.EnableForProject=0")
+CVars=("foliage.DensityScale=1")
+CVars=("grass.DensityScale=1")
+CVars=("r.Streaming.PoolSize=3000")
+CVars=("sg.ResolutionQuality=100")
+CVars=("sg.ViewDistanceQuality=2")
+CVars=("sg.AntiAliasingQuality=2")
+CVars=("sg.ShadowQuality=2")
+CVars=("sg.GlobalIlluminationQuality=2")
+CVars=("sg.ReflectionQuality=2")
+CVars=("sg.PostProcessQuality=2")
+CVars=("sg.TextureQuality=2")
+CVars=("sg.EffectsQuality=2")
+CVars=("sg.FoliageQuality=2")
+CVars=("sg.ShadingQuality=2")

; ============================================================================
; CarlaQuality_High
; ----------------------------------------------------------------------------
; High mirrors Epic on every non-Scalability CVar that lives here. The 6
; "axes" that distinguish High from Epic (smaller view bubble, lower
; texture sampling, cheaper Lumen reflections) overlap with [GroupName@3]
; bucket members and therefore CANNOT live here -- DeviceProfile values
; lose to the bucket apply. Those 6 axes are passed at engine init via
; -execcmds= from run-carla-host.sh, which fires at SetByConsole and wins.
; ============================================================================
[CarlaQuality_High DeviceProfile]
DeviceType=Linux
BaseProfileName=
+CVars=("r.Lumen.HardwareRayTracing=1")
+CVars=("r.RayTracing.ForceAllRayTracingEffects=-1")
+CVars=("r.RayTracing.Shadows=1")
+CVars=("r.Shadow.Virtual.MaxPhysicalPages=8192")
+CVars=("r.Shadow.DistanceScale=2")
+CVars=("r.Shadow.Virtual.UseFarShadowCulling=0")
+CVars=("r.SkinCache.SceneMemoryLimitInMB=1024")
+CVars=("r.TSR.History.ScreenPercentage=200")
+CVars=("r.LumenScene.SurfaceCache.AtlasSize=4096")
; Hand the medium-roughness band off from Lumen to SSR / reflection captures
; so wet-asphalt-like surfaces (~0.2-0.3 roughness) stop smearing
; traffic-light radiance via Lumen surface cache. Mirrors Epic.
+CVars=("r.Lumen.Reflections.MaxRoughnessToTrace=0.2")
+CVars=("r.MegaLights.EnableForProject=1")
+CVars=("r.Nanite.Streaming.PoolSize=512")
+CVars=("r.Streaming.AmortizeCPUToGPUCopy=1")
+CVars=("r.AntiAliasingMethod=4")
+CVars=("r.ReflectionCaptureResolution=512")
+CVars=("r.CustomDepth=3")
+CVars=("Foliage.DitheredLOD=1")
+CVars=("foliage.DensityScale=1")
+CVars=("grass.DensityScale=1")
+CVars=("r.DefaultFeature.AntiAliasing=1")
+CVars=("r.Streaming.PoolSize=4000")
+CVars=("sg.ResolutionQuality=100")
+CVars=("sg.ViewDistanceQuality=3")
+CVars=("sg.AntiAliasingQuality=3")
+CVars=("sg.ShadowQuality=3")
+CVars=("sg.GlobalIlluminationQuality=3")
+CVars=("sg.ReflectionQuality=3")
+CVars=("sg.PostProcessQuality=3")
+CVars=("sg.TextureQuality=3")
+CVars=("sg.EffectsQuality=3")
+CVars=("sg.FoliageQuality=3")
+CVars=("sg.ShadingQuality=3")

