; CARLA UE5 — per-quality DeviceProfiles.
;
; Each tier has a custom DeviceProfile that carries its non-Scalability CVar
; values. The runtime delegate (CarlaSettingsDelegate.cpp) does NOT apply
; per-tier CVars at runtime any more — that runtime burst was the trigger of
; NVIDIA Xid 109 GR CTX SWITCH TIMEOUT on Blackwell + recent OKM.
;
; Profile selection is driven by -deviceprofile=CarlaQuality_<Tier> on the
; command line, injected by run-carla-host.sh based on -quality-level=<Tier>.
;
; CVar priority recap:
;   SetByDeviceProfile (this file)
;     < SetByScalability (DefaultScalability.ini bucket sections fired by
;       Scalability::InitScalabilitySystem after sg.*Quality is set)
;     < SetByConsole (-execcmds= and runtime GEngine->Exec)
;
; So: bucket members for any sg.* group set here are LATER overridden by the
; matching [GroupName@N] section in DefaultScalability.ini. That is exactly
; what we want for sg.*Quality selectors -- we set the level here, the bucket
; section provides the per-member values. For non-Scalability CVars, no
; bucket touches them, so the DeviceProfile value wins.
;
; CVars that need to override bucket members (e.g. High's 6 axes) cannot live
; here -- they must be applied at SetByConsole via -execcmds= or runtime
; Exec. run-carla-host.sh injects them.

; ============================================================================
; CarlaQuality_Low
; ============================================================================
[CarlaQuality_Low DeviceProfile]
DeviceType=Linux
BaseProfileName=
+CVars=("r.ReflectionMethod=2")
+CVars=("r.Lumen.HardwareRayTracing=0")
+CVars=("r.RayTracing.ForceAllRayTracingEffects=0")
+CVars=("r.RayTracing.Shadows=0")
+CVars=("r.Shadow.Virtual.MaxPhysicalPages=2048")
+CVars=("r.SkinCache.SceneMemoryLimitInMB=256")
+CVars=("r.ReflectionCaptureResolution=256")
+CVars=("r.MegaLights.EnableForProject=0")
+CVars=("r.LumenScene.SurfaceCache.AtlasSize=2048")
+CVars=("r.Nanite.Streaming.PoolSize=128")
+CVars=("r.AntiAliasingMethod=2")
+CVars=("r.DefaultFeature.MotionBlur=0")
+CVars=("r.DefaultFeature.AutoExposure=1")
+CVars=("r.Lumen.DiffuseIndirect.Scale=1.25")
+CVars=("foliage.DensityScale=0")
+CVars=("grass.DensityScale=0")
+CVars=("r.Streaming.PoolSize=3000")
; Bucket selectors. Low uses sg.*Quality 1 except sg.GIQ=2 (pull Medium's
; Lumen SW preset for readable indirect fill in shadow regions) and sg.RQ=0
; (kill Lumen reflections; SSR fills in via -execcmds r.SSR.Quality 2).
+CVars=("sg.ResolutionQuality=50")
+CVars=("sg.ViewDistanceQuality=1")
+CVars=("sg.AntiAliasingQuality=1")
+CVars=("sg.ShadowQuality=1")
+CVars=("sg.GlobalIlluminationQuality=2")
+CVars=("sg.ReflectionQuality=0")
+CVars=("sg.PostProcessQuality=1")
+CVars=("sg.TextureQuality=1")
+CVars=("sg.EffectsQuality=1")
+CVars=("sg.FoliageQuality=1")
+CVars=("sg.ShadingQuality=1")

