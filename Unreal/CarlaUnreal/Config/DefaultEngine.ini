[SystemSettings]
; Applied via ApplyCVarSettingsFromIni at init, which CAN set ECVF_ReadOnly
; cvars -- unlike [/Script/Engine.RendererSettings], which only applies keys
; backed by a URendererSettings UPROPERTY and silently drops the rest.
;
; Vulkan bindless resource-descriptor heap. The 5.8 default (768k) covers every
; SRV/UAV/CBV plus ray-tracing acceleration structures from ONE pool; a World
; Partition flythrough on a large town (Town12) with hardware Lumen + Nanite
; streams enough unique meshes to exhaust it, and the allocator then hands out
; an invalid handle that trips check() in
; FVulkanBindlessDescriptorManager::UpdateDescriptor (SIGSEGV on the RHI
; thread). Descriptors are tens of bytes, so 2M costs on the order of ~100 MB
; of heap -- cheap insurance against streaming-driven descriptor pressure.
r.Vulkan.Bindless.MaxResourceDescriptorCount=2097152
;
; Ray-tracing BLAS pool. The 5.8 default (400 MB) is sized for game scenes;
; a CARLA town keeps enough unique static meshes always-resident (1 LOD per
; geometry group, r.RayTracing.NumAlwaysResidentLODs) to exceed 20% of it,
; which trips the red on-screen "ALWAYS RESIDENT MEMORY EXCEEDS 20% OF THE
; BUDGET" debug warning and leaves little headroom for streamed BLAS
; (eviction/rebuild churn -> hitches). 1.5 GB of VRAM makes the resident set
; a small fraction again and gives streaming real headroom. Town10's
; always-resident set is ~497 MiB. CAUTION: values >= ~2148 overflow int32
; in FUnitConversion::Convert inside FRayTracingGeometryManager (UE 5.8) --
; the pool goes negative (on-screen warnings then show "15.999 EiB" and
; misfire), so 2000 is the largest safe value. Since 20% of 2000 MB is
; still < 497 MiB, the purely-informational always-resident warning
; threshold is raised to 50% instead.
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=2000
r.RayTracing.Debug.GeometryMemoryPool.AlwaysResidentWarningPercentage=50
;
; Lumen cached-lighting pre-exposure. Safe exposure range is
; [value-12, value+8] EV (float16 lighting storage); the engine default 4
; gives [-8, 12] and CARLA's bright noon runs at EV ~12.6, tripping the
; on-screen "cached lighting ... is going to be clipped" warning. 6 shifts
; the window to [-6, 14]: noon fits with margin and street-lit night
; scenes (EV ~0) stay well inside.
r.EyeAdaptation.CachedLightingPreExposure=6
;
; Occlusion culling is left ENABLED (engine default). The self-pump cvar below
; already removes the occlusion-query deadlock at its root, and culling REDUCES
; GPU work -- which matters directly for the context-switch watchdog.
; (Previously this was r.AllowOcclusionQueries=0.)
;
; ROOT FIX for the CPU-side server-freeze under load. On the UE5.8 parallel
; Vulkan RHI, RHIGetRenderQueryResult(bWait=true) -> ProcessInterruptQueueUntil,
; when the dedicated interrupt thread is enabled, simply blocks on
; GraphEvent->Wait(), waiting for that thread to signal GPU completion. Under a
; heavy path-traced capture the interrupt/submission pipeline stalls, that wait
; never returns, and the render thread deadlocks mid-command (proven via gdb at
; multiple call sites: our sensor readback AND the engine's GPU occlusion
; culling), freezing the whole server behind FFrameEndSync. With the interrupt
; thread OFF, the waiting thread PROCESSES the completion queue itself (the
; self-pumping path already present in ProcessInterruptQueueUntil), so it can
; never deadlock on another thread. ECVF_ReadOnly -- must be set at init.
r.Vulkan.Submission.UseInterruptThread=0
;
; Path-tracer denoiser. Backend is DLSS Ray Reconstruction (DLSSRRDenoiser
; engine plugin, raw NGX Vulkan, ~0.6 ms at 1080p on RTX 5090).
; BUILD-TIME TRAP: the plugin compiles its NGX path only when the DLSS_SDK
; environment variable is set when UnrealBuildTool generates its makefile,
; and UBT does NOT track environment variables - an engine rebuild from a
; shell without DLSS_SDK silently ships a stub module (touch the plugin's
; Build.cs and rebuild with DLSS_SDK set to recover). With the stub, the
; DLSSRR name lookup falls back to the experimental NFOR plugin, which on
; this Vulkan setup returns an all-black image for every scene-capture frame
; and costs hundreds of ms per denoise - every rt_lens sensor became a 2 fps
; black screen. If rt_lens goes black+noisy again, check the log: healthy is
; DLSS-RR/NGX init lines, broken is "LogNFORDenoise: ... Denoised".
r.PathTracing.Denoiser=1
r.PathTracing.SpatialDenoiser.Type=1
r.PathTracing.Denoiser.Name=DLSSRR
r.PathTracing.TemporalDenoiser.Name=DLSSRR
; Real-time path-trace quality for rt_lens at 1 spp with DLSS-RR:
; - MaxBounces=2: bounded path length; the dominant lighting for driving scenes
;   is direct sun/sky + one bounce, and every extra bounce multiplies variance.
; - FilterWidth=0: the PT pixel filter jitters the sub-pixel sample position
;   every frame, but that jitter is unknown to NGX (we report 0,0). DLSS-RR's
;   contract requires the reported jitter to match the actual one, so lock
;   samples to the pixel center and let DLAA provide the anti-aliasing.
; - MaxPathIntensity=10: clamp light paths to kill 1-spp fireflies, which the
;   denoiser would otherwise smear into blinking blobs. (The clamp operates in
;   the path tracer's exposure-relative units, so it coexists with the
;   physical 100k lux sun - it was once misdiagnosed as the black-screen
;   cause; the actual causes were the stub denoiser build above and the
;   sensor's runaway eye adaptation, both fixed.)
r.PathTracing.MaxBounces=2
r.PathTracing.FilterWidth=0
r.PathTracing.MaxPathIntensity=10
; Finish the full PathTracingSamplesPerPixel budget every frame (0 = run as
; many sample passes per frame as are still missing, engine-capped at 16).
; A moving camera invalidates accumulation every frame, so without this only
; spp=1 sensors ever reached the denoise gate; with it, rt_lens sensors can
; run spp=4 while driving, which feeds DLSS-RR a 4x cleaner radiance/AOV set
; and removes the smeared-texture / blinking-light-blob artifacts of 1 spp.
r.PathTracing.FramePassCount=0
; UE 5.8 Nanite skinned meshes have no ray-tracing representation, so
; Nanite-skinned vehicles and pedestrians are absent from the path tracer's
; scene: rt_lens showed vehicles as floating glass (the only non-Nanite
; sections) and walkers not at all. Disable Nanite for skinned meshes so they
; take the classic skeletal path, which builds RT geometry through the GPU
; skin cache. ECVF_ReadOnly -- must be set at init.
r.Nanite.AllowSkinnedMeshes=0
; Nanite cluster streaming pool. Town12 streams ~26k Nanite meshes; with the
; 512 MB default the pool churns and fine geometry only streams in when the
; camera is already close, which shows up as visible geometry changes on
; buildings at short range. 1536 MB gives the pool ~3x headroom. Do not raise
; to 2048: the engine requires the pool to be strictly smaller than the
; largest RHI buffer allocation and fatals at boot otherwise
; (NaniteStreamingManager.cpp UpdatePageConfiguration).
r.Nanite.Streaming.StreamingPoolSize=1536
; Do NOT also set r.Vulkan.Submission.UseSubmissionThread=0: with BOTH the
; submission and interrupt threads off, an idle server GPU-crashes with
; VK_ERROR_DEVICE_LOST / kernel Xid 109 CTX SWITCH TIMEOUT in Nanite::ShadeBinning
; on the main Lumen view. The interrupt thread alone is what fixes the deadlock.
;r.Vulkan.Submission.UseSubmissionThread=0


[ConsoleVariables]
; g.TimeoutForBlockOnRenderFence caps how long a blocking readback may stall
; the render thread before the engine treats it as a hang. The value is in
; milliseconds: 30 s is far above any healthy readback yet surfaces stuck
; captures fast; applied globally so it takes effect before any sensor ticks
; (sensor BeginPlay overrides masked real hangs with a 300 s wait).
g.TimeoutForBlockOnRenderFence=30000

