on:
  workflow_call:
    inputs:
      python-versions:
        description: "Comma-separated Python versions to build the Python API wheel for, e.g. 3.10,3.11,3.12. The first one is the build's main Python. Each one is the interpreter py -<version> runs."
        required: true
        type: string
      additional-args:
        type: string
        required: false
        default: ""
      additional-maps:
        type: boolean
        default: true
      additional-maps-file:
        description: "JSON list of the maps for the AdditionalMaps pack (default: Util/ContentPacks/AdditionalMaps.json)"
        type: string
        required: false
        default: ""
      latest-prefix:
        description: "Name prefix of the latest uploads (default in Deploy.bat: CARLA_UE5_Latest)"
        type: string
        required: false
        default: ""
      release-version:
        description: "Release version, e.g. 1.0: uploads to Windows/ as CARLA_<version>.zip instead of to Windows/Dev/ (empty: nightly)"
        type: string
        required: false
        default: ""
      upload-package:
        type: boolean
        required: true
      upload-replace-latest:
        type: boolean
        required: true

    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_ACCESS_KEY:
        required: false

jobs:
  windows:
    name: Windows CI/CD
    defaults:
      run:
        shell: cmd
    runs-on: self-hosted:windows
    env:
      CARLA_UNREAL_ENGINE_PATH: C:\Users\jenkins\unreal-engine5
      CARLA_CONTENT_CACHE: C:\Users\jenkins\carla-content-cache\ue5
      VCVARS: C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat
      PYTHON_VERSIONS: ${{ inputs.python-versions }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update CARLA Content cache
        run: |
          call Util\Tools\UpdateContentCache.bat --path "%CARLA_CONTENT_CACHE%" --branch ue58-dev-carla

      - name: Copy content to workspace
        run: |
          set DEST=Unreal\CarlaUnreal\Content\Carla

          if exist "%DEST%" rmdir /s /q "%DEST%"
          rem Copy everything from the cache except the .git folder.
          robocopy "%CARLA_CONTENT_CACHE%" "%DEST%" /E /XD "%CARLA_CONTENT_CACHE%\.git" /MT:16 /NFL /NDL /NJH /NP
          if %ERRORLEVEL% GEQ 8 exit /b %ERRORLEVEL%
          exit /b 0

      - name: Preset
        run: |
          setlocal EnableDelayedExpansion
          set PYTHON_ARGS=
          set CMAKE_PYTHON_VERSIONS=
          for %%V in (%PYTHON_VERSIONS:,= %) do (
            set VERSION=%%V
            set EXECUTABLE=
            for /f "usebackq delims=" %%P in (`py -%%V -c "import sys; print(sys.executable)"`) do set "EXECUTABLE=%%P"
            if "!EXECUTABLE!"=="" (
              echo ::error::Python %%V not found: py -%%V failed
              exit /b 1
            )
            rem The main Python, the first version, is the one the build is configured with.
            if "!CMAKE_PYTHON_VERSIONS!"=="" (
              set PYTHON_ARGS=!PYTHON_ARGS! "-DPython3_EXECUTABLE=!EXECUTABLE!" "-DPython_EXECUTABLE=!EXECUTABLE!"
              set CMAKE_PYTHON_VERSIONS=%%V
            ) else (
              set CMAKE_PYTHON_VERSIONS=!CMAKE_PYTHON_VERSIONS!;%%V
            )
            set PYTHON_ARGS=!PYTHON_ARGS! "-DCARLA_PYTHON_!VERSION:.=!_EXECUTABLE=!EXECUTABLE!"
          )
          call "%VCVARS%" || exit /b 1
          cmake --preset Release -DBUILD_LIBCARLA_TESTS=ON ^
            "-DCARLA_RELEASE_VERSION=${{ inputs.release-version }}" ^
            "-DCARLA_PYTHON_VERSIONS=%CMAKE_PYTHON_VERSIONS%" %PYTHON_ARGS%

      - name: Build LibCarla
        run: |
          call "%VCVARS%" || exit /b 1
          cmake --build Build\Release --target carla-client

      - name: Build PythonAPI
        run: |
          call "%VCVARS%" || exit /b 1
          cmake --build Build\Release --target carla-python-api

      - name: Build CarlaServer
        run: |
          call "%VCVARS%" || exit /b 1
          cmake --build Build\Release --target carla-server

      - name: Build LibCarla Tests
        run: |
          call "%VCVARS%" || exit /b 1
          cmake --build Build\Release --target libcarla_test_server || exit /b 1
          cmake --build Build\Release --target libcarla_test_client

      - name: Fetch LibCarla test content
        run: |
          if exist Build\test-content rmdir /s /q Build\test-content
          git clone --depth 1 -b 0.1.4 https://github.com/carla-simulator/opendrive-test-files.git Build\test-content

      - name: Run LibCarla Tests
        run: |
          Build\Release\LibCarla\libcarla_test_server.exe || exit /b 1
          Build\Release\LibCarla\libcarla_test_client.exe

      - name: Build Package
        run: |
          call "%VCVARS%" || exit /b 1
          cmake --build Build\Release --target package

      - name: Build AdditionalMaps pack
        if: inputs.additional-maps == true
        env:
          ADDITIONAL_MAPS_FILE: ${{ inputs.additional-maps-file }}
        run: |
          set MAPS_FILE=
          if not "%ADDITIONAL_MAPS_FILE%"=="" for %%F in ("%ADDITIONAL_MAPS_FILE%") do set "MAPS_FILE=%%~fF"
          call "%VCVARS%" || exit /b 1
          if defined MAPS_FILE cmake Build\Release "-DCARLA_ADDITIONAL_MAPS_FILE=%MAPS_FILE:\=/%" || exit /b 1
          cmake --build Build\Release --target package-additional-maps

      - name: Configure Backblaze
        if: inputs.upload-package == true
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} || exit /b 1
          aws configure set aws_secret_access_key ${{ secrets.AWS_ACCESS_KEY }}

      - name: Upload package
        if: inputs.upload-package == true
        id: upload_step
        env:
          LATEST_PREFIX: ${{ inputs.latest-prefix }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set ARGS=
          IF "${{ inputs.upload-replace-latest }}"=="true" SET ARGS=%ARGS% --replace-latest
          IF "${{ inputs.additional-maps }}"=="true" SET ARGS=%ARGS% --additional-maps
          IF NOT "%LATEST_PREFIX%"=="" SET ARGS=%ARGS% --latest-prefix %LATEST_PREFIX%
          IF NOT "%RELEASE_VERSION%"=="" SET ARGS=%ARGS% --release-version %RELEASE_VERSION%
          call Util\Tools\Deploy.bat %ARGS% --summary-output "%GITHUB_OUTPUT%"

      - name: Write summary
        if: inputs.upload-package == true
        run: |
          echo ## [Windows] CARLA UE5 CI/CD Summary>> %GITHUB_STEP_SUMMARY%
          echo.>> %GITHUB_STEP_SUMMARY%
          echo - CARLA Package: ${{ steps.upload_step.outputs.package_uri }}>> %GITHUB_STEP_SUMMARY%
          echo - Release metadata: ${{ steps.upload_step.outputs.release_metadata_uri }}>> %GITHUB_STEP_SUMMARY%
          IF NOT "${{ steps.upload_step.outputs.additional_maps_uri }}"=="" (
            echo - AdditionalMaps pack: ${{ steps.upload_step.outputs.additional_maps_uri }}>> %GITHUB_STEP_SUMMARY%
          )
          IF NOT "${{ steps.upload_step.outputs.latest_package_uri }}"=="" (
            echo - Latest package: ${{ steps.upload_step.outputs.latest_package_uri }}>> %GITHUB_STEP_SUMMARY%
            echo - Latest release metadata: ${{ steps.upload_step.outputs.latest_release_metadata_uri }}>> %GITHUB_STEP_SUMMARY%
          )
          IF NOT "${{ steps.upload_step.outputs.latest_additional_maps_uri }}"=="" (
            echo - Latest AdditionalMaps pack: ${{ steps.upload_step.outputs.latest_additional_maps_uri }}>> %GITHUB_STEP_SUMMARY%
          )
