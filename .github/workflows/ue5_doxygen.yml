name: UE5-Doxygen

# Generates the C++ reference with Doxygen and publishes it to
# carla-simulator/carla-simulator.github.io (branch master) under Doxygen/html,
# replacing the previous version. Run it manually on ue58-dev.
# Needs the environment "docs" (deployment branches: ue58-dev only) holding the
# secret DOCS_DEPLOY_KEY: the private half of an SSH deploy key with
# write access on carla-simulator.github.io.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doxygen-publish
  cancel-in-progress: false

jobs:
  doxygen:
    name: Generate and publish Doxygen
    runs-on: ubuntu-latest
    environment: docs
    env:
      DEST: Doxygen/html
      # Doxygen release binary, pinned with its checksum (the digest GitHub
      # shows for the release asset). Ubuntu's apt package lags far behind.
      DOXYGEN_VERSION: 1.18.0
      DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/ue58-dev" ]; then
            echo "::error::Docs are only published from ue58-dev, not '$GITHUB_REF'."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          tarball="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/$tarball"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" "doxygen-${DOXYGEN_VERSION}/bin/doxygen"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate documentation
        run: |
          doxygen --version
          doxygen Doxyfile

      - name: Upload Doxygen warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-warnings
          path: Doxygen/warnings.log
          if-no-files-found: ignore

      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          repository: carla-simulator/carla-simulator.github.io
          ref: master
          path: doc_repo
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - name: Publish documentation
        working-directory: doc_repo
        run: |
          mkdir -p "$DEST"
          rsync -a --delete ../Doxygen/html/ "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEST"
          if git diff --cached --quiet; then
            echo "Documentation unchanged, nothing to publish."
            exit 0
          fi
          git commit -q -m "Updated C++ docs from carla@${GITHUB_SHA::9} ($GITHUB_REF_NAME)"
          git push origin HEAD:master || { git pull --rebase origin master && git push origin HEAD:master; }

      - name: Write summary
        run: |
          {
            echo "## CARLA C++ documentation"
            echo ""
            echo "- Published: https://carla-simulator.github.io/$DEST/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
