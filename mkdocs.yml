# Shipped as the README of the package (Unreal/Package/CopyCarlaAdditionalFiles.cmake), not a site page
not_in_nav: |
  /release_readme.md

# section-index: a section whose first page has no title opens that page from the section title
plugins:
  - search
  - section-index

hooks:
  - docs_hooks.py

markdown_extensions:
  - admonition 

theme:
  name: 'readthedocs'
  logo: img/logos/carla_ue5_logo.webp
  palette:
        # Dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
 
