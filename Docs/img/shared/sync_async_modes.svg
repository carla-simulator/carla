<text x="220" y="352" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="start" font-style="italic" xml:space="preserve">shown with a variable time step: each frame covers as much simulated time as it took to compute</text>
