<rect width="1260" height="720" fill="#ffffff"/>
<text x="630.0" y="44" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Asynchronous vs synchronous mode</text>
<text x="630.0" y="72" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">Who decides when the simulation advances, and how much simulated time each step covers</text>
<rect x="30" y="95" width="1200" height="270" rx="14" fill="#f5f8fa" stroke="#c9d3da" stroke-width="1.5"/>
<text x="55" y="128" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2b2b2b" font-weight="bold" text-anchor="start" xml:space="preserve">Asynchronous (default)</text>
<text x="55" y="152" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5f6b73" font-weight="normal" text-anchor="start" xml:space="preserve">The server ticks as fast as it can. The client reads whatever frame is current and may miss frames.</text>
<text x="180" y="220" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#3c9a5f" font-weight="bold" text-anchor="end" xml:space="preserve">server</text>
