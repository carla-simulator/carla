<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640"><defs><marker id="ah_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker><marker id="ah_sub" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b73"/></marker><marker id="ah_line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3da"/></marker><marker id="ah_card" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f8fa"/></marker><marker id="ah_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/></marker><marker id="ah_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/></marker><marker id="ah_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c9a5f"/></marker><marker id="ah_orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e69138"/></marker><marker id="ah_purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker><marker id="ah_white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="ah_soft_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3f0f9"/></marker><marker id="ah_soft_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbe6e5"/></marker><marker id="ah_soft_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4f3e9"/></marker><marker id="ah_soft_orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf0e1"/></marker><marker id="ah_soft_purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#efe9f8"/></marker></defs>
<rect width="1260" height="640" fill="#ffffff"/>
<text x="630.0" y="42" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Alpamayo closed loop in CARLA</text>
<text x="630.0" y="70" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">One control cycle: observe, pause the simulation while the model infers, then drive the predicted trajectory</text>
<rect x="60" y="130" width="300" height="150" rx="10" fill="#e4f3e9" stroke="#3c9a5f" stroke-width="2"/>
<text x="210.0" y="183.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">CARLA server</text>
<text x="210.0" y="202.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">world state, vehicle physics</text>
<text x="210.0" y="222.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">CARLA cameras and actors</text>
<text x="210.0" y="241.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">synchronous mode</text>
<rect x="480" y="130" width="300" height="150" rx="10" fill="#e3f0f9" stroke="#2980b9" stroke-width="2"/>
<text x="630.0" y="183.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Control client</text>
<text x="630.0" y="202.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">the only client that ticks</text>
<text x="630.0" y="222.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">controller, dashboard, recorder</text>
<text x="630.0" y="241.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">telemetry sidecar</text>
<rect x="900" y="130" width="300" height="150" rx="10" fill="#efe9f8" stroke="#7e57c2" stroke-width="2"/>
<text x="1050.0" y="183.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Alpamayo model service</text>
<text x="1050.0" y="202.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">isolated Python 3.12 environment</text>
<text x="1050.0" y="222.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">local TCP, default port 8767</text>
<text x="1050.0" y="241.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">stays loaded between runs</text>
<rect x="480" y="440" width="300" height="120" rx="10" fill="#fdf0e1" stroke="#e69138" stroke-width="2"/>
<text x="630.0" y="487.5" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">NRE container (NuRec mode)</text>
<text x="630.0" y="507.0" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">neural camera rendering</text>
<text x="630.0" y="526.5" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">over gRPC</text>
<line x1="478" y1="180" x2="364" y2="180" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ah_blue)"/>
<text x="421" y="170" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="middle" xml:space="preserve">tick 0.1 s</text>
<text x="421" y="198" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="middle" xml:space="preserve">vehicle control</text>
<line x1="362" y1="240" x2="476" y2="240" stroke="#3c9a5f" stroke-width="2.5" marker-end="url(#ah_green)"/>
<text x="419" y="262" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3c9a5f" font-weight="normal" text-anchor="middle" xml:space="preserve">frames, ego state</text>
<line x1="782" y1="180" x2="896" y2="180" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ah_blue)"/>
<text x="840" y="158" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="middle" xml:space="preserve">7 camera slots</text>
<text x="840" y="198" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="middle" xml:space="preserve">1.6 s ego history</text>
<line x1="898" y1="240" x2="784" y2="240" stroke="#7e57c2" stroke-width="2.5" marker-end="url(#ah_purple)"/>
<text x="840" y="262" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7e57c2" font-weight="normal" text-anchor="middle" xml:space="preserve">64 waypoints</text>
<text x="840" y="280" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7e57c2" font-weight="normal" text-anchor="middle" xml:space="preserve">over 6.4 s</text>
<text x="840" y="298" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7e57c2" font-weight="normal" text-anchor="middle" xml:space="preserve">reasoning text</text>
<line x1="600" y1="284" x2="600" y2="436" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ah_blue)" stroke-dasharray="7,5"/>
<text x="590" y="350" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="end" xml:space="preserve">camera poses</text>
<text x="590" y="368" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="end" xml:space="preserve">(one batched request)</text>
<line x1="660" y1="438" x2="660" y2="286" stroke="#e69138" stroke-width="2.5" marker-end="url(#ah_orange)" stroke-dasharray="7,5"/>
<text x="672" y="360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#e69138" font-weight="normal" text-anchor="start" xml:space="preserve">neural camera frames</text>
<rect x="60" y="330" width="340" height="260" rx="12" fill="#f5f8fa" stroke="#c9d3da" stroke-width="1.5"/>
<text x="80" y="362" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="start" xml:space="preserve">One cycle</text>
<text x="80" y="396" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">1  tick the world at 0.1 s steps</text>
<text x="80" y="426" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">2  collect cameras and ego history</text>
<text x="80" y="456" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">3  pause while the model infers</text>
<text x="80" y="486" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">4  receive the trajectory</text>
<text x="80" y="516" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">5  drive the first 10 steps (1 s)</text>
<text x="80" y="546" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#2b2b2b" font-weight="normal" text-anchor="start" xml:space="preserve">6  observe again and replan</text>
<rect x="860" y="440" width="340" height="120" rx="12" fill="#f5f8fa" stroke="#c9d3da" stroke-width="1.5"/>
<text x="880" y="472" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="start" xml:space="preserve">Inference time does not</text>
<text x="880" y="496" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="start" xml:space="preserve">advance the simulation: the</text>
<text x="880" y="520" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="start" xml:space="preserve">world waits for the prediction.</text>
</svg>
