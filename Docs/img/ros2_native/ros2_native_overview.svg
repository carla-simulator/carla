<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560"><defs><marker id="ah_ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker><marker id="ah_sub" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b73"/></marker><marker id="ah_line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d3da"/></marker><marker id="ah_card" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f8fa"/></marker><marker id="ah_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/></marker><marker id="ah_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/></marker><marker id="ah_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c9a5f"/></marker><marker id="ah_orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e69138"/></marker><marker id="ah_purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e57c2"/></marker><marker id="ah_white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="ah_soft_blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3f0f9"/></marker><marker id="ah_soft_red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbe6e5"/></marker><marker id="ah_soft_green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4f3e9"/></marker><marker id="ah_soft_orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fdf0e1"/></marker><marker id="ah_soft_purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#efe9f8"/></marker></defs>
<rect width="1260" height="560" fill="#ffffff"/>
<text x="630.0" y="42" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">CARLA&#x27;s native ROS 2 interface</text>
<text x="630.0" y="70" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">The server itself publishes and subscribes: no bridge process between CARLA and the ROS 2 graph</text>
<rect x="40" y="110" width="380" height="410" rx="14" fill="#e4f3e9" stroke="#3c9a5f" stroke-width="2"/>
<text x="230" y="145" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">CARLA server</text>
<text x="230" y="168" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">started with -ros2</text>
<rect x="70" y="190" width="320" height="120" rx="10" fill="#ffffff" stroke="#3c9a5f" stroke-width="2"/>
<text x="230.0" y="228.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Sensors</text>
<text x="230.0" y="247.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">cameras, lidars, radar</text>
<text x="230.0" y="267.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">IMU, GNSS, collision</text>
<text x="230.0" y="286.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">one topic set per sensor</text>
<rect x="70" y="330" width="320" height="80" rx="10" fill="#ffffff" stroke="#3c9a5f" stroke-width="2"/>
<text x="230.0" y="366.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Simulation</text>
<text x="230.0" y="386.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">clock and transform tree</text>
<rect x="70" y="425" width="320" height="80" rx="10" fill="#ffffff" stroke="#3c9a5f" stroke-width="2"/>
<text x="230.0" y="461.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Ego vehicle (hero or ego)</text>
<text x="230.0" y="481.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">one control surface per vehicle</text>
<rect x="470" y="110" width="300" height="410" rx="14" fill="#f5f8fa" stroke="#c9d3da" stroke-width="2"/>
<text x="620" y="145" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Middleware (RMW)</text>
<text x="620" y="168" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">chosen at launch</text>
<rect x="500" y="190" width="240" height="78" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
<text x="620.0" y="225.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">FastDDS</text>
<text x="620.0" y="245.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">the default, UDPv4 only</text>
<rect x="500" y="285" width="240" height="78" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
<text x="620.0" y="320.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">CycloneDDS</text>
<text x="620.0" y="340.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">UDP</text>
<rect x="500" y="380" width="240" height="78" rx="10" fill="#ffffff" stroke="#5f6b73" stroke-width="2"/>
<text x="620.0" y="415.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Zenoh</text>
<text x="620.0" y="435.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">needs a Zenoh router</text>
<text x="620" y="500" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" font-style="italic" xml:space="preserve">same topics on every middleware</text>
<rect x="820" y="110" width="400" height="410" rx="14" fill="#e3f0f9" stroke="#2980b9" stroke-width="2"/>
<text x="1020" y="145" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">ROS 2 nodes</text>
<text x="1020" y="168" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">same ROS domain id as the server</text>
<rect x="850" y="190" width="340" height="78" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
<text x="1020.0" y="225.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">RViz</text>
<text x="1020.0" y="245.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">images, point clouds, transforms</text>
<rect x="850" y="285" width="340" height="78" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
<text x="1020.0" y="320.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Autoware</text>
<text x="1020.0" y="340.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">sensing in, control commands out</text>
<rect x="850" y="380" width="340" height="78" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
<text x="1020.0" y="415.75" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2b2b2b" font-weight="bold" text-anchor="middle" xml:space="preserve">Your own nodes</text>
<text x="1020.0" y="435.25" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#5f6b73" font-weight="normal" text-anchor="middle" xml:space="preserve">any subscriber or controller</text>
