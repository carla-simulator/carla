<text x="430" y="240" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3c9a5f" font-weight="normal" text-anchor="middle" xml:space="preserve">publish</text>
<line x1="392" y1="370" x2="466" y2="370" stroke="#3c9a5f" stroke-width="2.5" marker-end="url(#ah_green)"/>
<text x="430" y="360" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#3c9a5f" font-weight="normal" text-anchor="middle" xml:space="preserve">publish</text>
<line x1="468" y1="465" x2="394" y2="465" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ah_blue)"/>
<text x="430" y="455" font-family="Lato, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2980b9" font-weight="normal" text-anchor="middle" xml:space="preserve">subscribe</text>
<line x1="772" y1="290" x2="816" y2="290" stroke="#3c9a5f" stroke-width="2.5" marker-end="url(#ah_green)"/>
<line x1="818" y1="350" x2="774" y2="350" stroke="#2980b9" stroke-width="2.5" marker-end="url(#ah_blue)"/>
