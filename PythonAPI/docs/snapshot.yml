---
- module_name: carla
  # - CLASSES ------------------------------

  classes:
  - class_name: WorldSnapshot
    # - DESCRIPTION ------------------------
    doc: >
      This snapshot comprises all the information for every actor on scene at a certain moment of time. It creates and gives acces to a data structure containing a series of carla.ActorSnapshot. The client recieves a new snapshot on every tick that cannot be stored.  
    # - PROPERTIES -------------------------
    instance_variables:
    - var_name: platform_timestamp
      type: float
      var_units: seconds
      doc: >
        Time register of the frame at which the snapshot was taken, from the operating system.
    # --------------------------------------
    - var_name: frame_count
      type: int
      doc: >
        Frame the snapshot belongs to. Same value as <b>frame</b>.
    # --------------------------------------
    - var_name: elapsed_seconds
      type: float
      var_units: seconds
      doc: >
        Simulated seconds elapsed since the beginning of the episode.
    # --------------------------------------
    - var_name: delta_seconds
      type: float
      var_units: seconds
      doc: >
        Simulated seconds elapsed since the previous frame.
    # --------------------------------------
    - var_name: id
      type: int
      doc: >
        Identifier of the episode associated with this world. It remains constant across the episode's simulation ticks. Use carla.WorldSnapshot.frame to identify the tick represented by a snapshot. Loading or reloading the world starts a new episode.
    - var_name: frame
      type: int
      doc: >
        Simulation frame in which the snapshot was taken. 
    - var_name: timestamp
      type: carla.Timestamp
      var_units: seconds
      doc: >
         Precise moment in time when snapshot was taken. This class works in seconds as given by the operative system. 
    # - METHODS ----------------------------
    methods:
    - def_name: find
      return: carla.ActorSnapshot
      params: 
        - param_name: actor_id
          type: int
      doc: > 
        Given a certain actor ID, returns its corresponding snapshot or <b>None</b> if it is not found. 
    # --------------------------------------
    - def_name: get_actor_ids
      return: numpy.ndarray
      doc: >
        Ids of the actors in this snapshot, ascending, as a uint32 array. Needs numpy.
    # --------------------------------------
    - def_name: get_transforms
      return: numpy.ndarray
      params:
      - param_name: actor_ids
        type: list(int) or numpy array
        default: None
        doc: >
          Actors to read, one row each in this order. <b>None</b> reads every actor of the snapshot in ascending id order, the order of carla.WorldSnapshot.get_actor_ids.
      - param_name: out
        type: numpy array
        default: None
        doc: >
          A C-contiguous float64 array of the right size to fill instead of a new one.
      - param_name: return_mask
        type: bool
        default: False
        doc: >
          Also return a bool array that is <b>False</b> for the actors not in the snapshot.
      doc: >
        x, y, z (meters) and pitch, yaw, roll (degrees) of many actors at once, as an (N, 6) float64 array, read from this snapshot without calling the server. An actor not in the snapshot gets a row of NaN. With `return_mask`, returns `(array, mask)`. The location is in 64-bit precision, as the server holds it, whereas carla.ActorSnapshot.get_transform rounds it to 32-bit floats: about 0.5 mm at 7 km from the origin. Needs numpy.
    # --------------------------------------
    - def_name: get_velocities
      return: numpy.ndarray
      params:
      - param_name: actor_ids
        type: list(int) or numpy array
        default: None
        doc: >
          Actors to read, one row each in this order. <b>None</b> reads every actor of the snapshot in ascending id order, the order of carla.WorldSnapshot.get_actor_ids.
      - param_name: out
        type: numpy array
        default: None
        doc: >
          A C-contiguous float64 array of the right size to fill instead of a new one.
      - param_name: return_mask
        type: bool
        default: False
        doc: >
          Also return a bool array that is <b>False</b> for the actors not in the snapshot.
      doc: >
        Velocity (m/s) of many actors at once, as an (N, 3) float64 array, read from this snapshot without calling the server. An actor not in the snapshot gets a row of NaN. With `return_mask`, returns `(array, mask)`. Needs numpy.
    # --------------------------------------
    - def_name: get_angular_velocities
      return: numpy.ndarray
      params:
      - param_name: actor_ids
        type: list(int) or numpy array
        default: None
        doc: >
          Actors to read, one row each in this order. <b>None</b> reads every actor of the snapshot in ascending id order, the order of carla.WorldSnapshot.get_actor_ids.
      - param_name: out
        type: numpy array
        default: None
        doc: >
          A C-contiguous float64 array of the right size to fill instead of a new one.
      - param_name: return_mask
        type: bool
        default: False
        doc: >
          Also return a bool array that is <b>False</b> for the actors not in the snapshot.
      doc: >
        Angular velocity (deg/s) of many actors at once, as an (N, 3) float64 array, read from this snapshot without calling the server. An actor not in the snapshot gets a row of NaN. With `return_mask`, returns `(array, mask)`. Needs numpy.
    # --------------------------------------
    - def_name: get_accelerations
      return: numpy.ndarray
      params:
      - param_name: actor_ids
        type: list(int) or numpy array
        default: None
        doc: >
          Actors to read, one row each in this order. <b>None</b> reads every actor of the snapshot in ascending id order, the order of carla.WorldSnapshot.get_actor_ids.
      - param_name: out
        type: numpy array
        default: None
        doc: >
          A C-contiguous float64 array of the right size to fill instead of a new one.
      - param_name: return_mask
        type: bool
        default: False
        doc: >
          Also return a bool array that is <b>False</b> for the actors not in the snapshot.
      doc: >
        Acceleration (m/s^2) of many actors at once, as an (N, 3) float64 array, read from this snapshot without calling the server. An actor not in the snapshot gets a row of NaN. With `return_mask`, returns `(array, mask)`. Needs numpy.
    # --------------------------------------
    - def_name: has_actor
      return: bool
      params:
        - param_name: actor_id
          type: int
      doc: >
        Given a certain actor ID, checks if there is a snapshot corresponding it and so, if the actor was present at that moment.
    # --------------------------------------
    - def_name: __iter__
      doc: >
        Iterate over the carla.ActorSnapshot stored in the snapshot, in ascending actor id order.
    # --------------------------------------
    - def_name: __len__
      return: int
      doc: >
        Returns the amount of carla.ActorSnapshot present in this snapshot.
    # --------------------------------------
    - def_name: __eq__
      return: bool
      params:
        - param_name: other
          type: carla.WorldSnapshot
      doc: >
        Returns __True__ if both **<font color="#f8805a">timestamp</font>** are the same. 
    # --------------------------------------
    - def_name: __ne__
      return: bool
      params:
        - param_name: other
          type: carla.WorldSnapshot
      doc: >
        Returns <b>True</b> if both **<font color="#f8805a">timestamp</font>** are different. 
    # --------------------------------------

  - class_name: ActorSnapshot
    # - DESCRIPTION ------------------------
    doc: >
      A class that comprises all the information for an actor at a certain moment in time. These objects are contained in a carla.WorldSnapshot and sent to the client once every tick. 
    # - PROPERTIES -------------------------
    instance_variables:
    - var_name: id
      type: int
      doc: >
        An identifier for the snapshot itself. 
    # - METHODS ----------------------------
    methods:
    - def_name: get_acceleration
      return: carla.Vector3D
      return_units: m/s<sup>2</sup>
      doc: >
        Returns the acceleration vector registered for an actor in that tick, in world coordinates. 
    # --------------------------------------
    - def_name: get_angular_velocity
      return: carla.Vector3D
      return_units: rad/s
      doc: >
        Returns the angular velocity vector registered for an actor in that tick, in world coordinates.
    # --------------------------------------
    - def_name: get_transform
      return: carla.Transform
      doc: >
        Returns the actor's transform (location and rotation) for an actor in that tick. 
    # --------------------------------------
    - def_name: get_velocity
      return: carla.Vector3D
      return_units: m/s
      doc: > 
        Returns the velocity vector registered for an actor in that tick, in world coordinates.
    # --------------------------------------
...
