[project]
name = "carla-nurec"
version = "0.3"
description = "NVIDIA NuRec (NRE) integration for CARLA UE5"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "grpcio>=1.66",
    "protobuf>=5.29,<7",
    "carla>=0.10.0",
    "pyyaml",
    "pillow>=10",
]

[project.optional-dependencies]
# Legacy JPEG transfer path (NurecRenderer(image_format="jpeg")).
jpeg = ["nvidia-nvimgcodec-cu12>=0.5"]
