[project]
name = "carla-cosmos"
version = "0.2.0"
description = "NVIDIA Cosmos (Transfer 2.5 / Cosmos 3) integration client for CARLA UE5"
requires-python = ">=3.10"
# Core: contracts, clip format, HTTP client, CLI. No CARLA, no OpenCV, no GPU.
dependencies = [
    "numpy>=1.26",
    "pyyaml",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Capturing clips from a CARLA server (the carla wheel comes from the CARLA build).
capture = [
    "carla>=0.10.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "pillow>=10",
]
viewer = ["pygame>=2.6", "imageio-ffmpeg>=0.4"]  # ffmpeg fallback for the mp4 export when the system has none
test = ["pytest>=8"]

[project.scripts]
carla-cosmos = "carla_cosmos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carla_cosmos"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a running CARLA server (set CARLA_COSMOS_TEST_PORT)",
]
