name: latency-4gpu-all
description: >-
  Manual layout for a 4 x 96 GB node that serves all three model backends at once — Cosmos 3 Nano
  (CFG-parallel 2) and Transfer 2.5 general (context-parallel 2) share GPUs 0-1, Transfer 2.5 AV
  multiview (2 context-parallel ranks, 7 views) and the world-scenario renderer share GPUs 2-3.
  Resident memory per card: 37 + 28 GiB on 0-1 and 22 GiB on 2-3, against 86 GiB usable (0.9 x 96),
  which leaves room for the 12 GiB working set of whichever worker is generating.  `latency-4gpu-av`
  gives a single 7-camera query all four GPUs and is faster for AV, but serves no Transfer 2.5
  general; this profile is the one to start with when a run needs every backend without a restart.
  The scheduler never runs jobs on GPU-sharing workers at the same time.
workers:
  - name: cosmos3-nano
    type: cosmos3
    backends: [cosmos3-nano]
    gpus: [0, 1]
    args: ["--tp", "1", "--cfg-parallel", "2", "--ulysses", "1"]
  - name: transfer25
    type: transfer25
    backends: [transfer2.5]
    gpus: [0, 1]
    args: ["--context-parallel-size", "2", "--master-port", "12342"]
  - name: transfer25-av
    type: transfer25_av
    backends: [transfer2.5-av]
    gpus: [2, 3]
    args: ["--nproc", "2", "--master-port", "12341"]
  - name: wsm-renderer
    type: wsm_renderer
    backends: [wsm-renderer]
    gpus: [3]
