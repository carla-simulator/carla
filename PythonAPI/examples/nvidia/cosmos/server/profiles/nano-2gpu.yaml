name: nano-2gpu
description: Cosmos 3 Nano (GPU 0) + Transfer 2.5 general with server-side wsm rendering (GPU 1); 2-7 GPUs
priority: 20
match: {min_gpus: 2, max_gpus: 7, min_memory_gib: 40}
workers:
  - name: cosmos3-nano
    type: cosmos3
    backends: [cosmos3-nano]
    gpus: [0]
    args: ["--tp", "1"]
  - name: transfer25
    type: transfer25
    backends: [transfer2.5]
    gpus: [1]
  - name: wsm-renderer
    type: wsm_renderer
    backends: [wsm-renderer]
    gpus: [1]
