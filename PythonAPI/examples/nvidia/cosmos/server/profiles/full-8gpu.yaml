name: full-8gpu
description: >-
  Provisional 8-GPU layout for the :full image — Cosmos 3 Super (TP=4, GPUs 0-3),
  Cosmos 3 Nano (GPU 4), Transfer 2.5 general (GPU 5), wsm renderer (GPU 5).
  Transfer 2.5 AV needs all 8 GPUs exclusively: use profile av-8gpu instead.
  GPU assignment is tuned in Phase 7 on the target node.
priority: 10
match: {min_gpus: 8, min_memory_gib: 70}   # H100 80 GB reports 79.6 GiB
workers:
  - name: cosmos3-super
    type: cosmos3
    backends: [cosmos3-super]
    gpus: [0, 1, 2, 3]
    args: ["--tp", "4"]
  - name: cosmos3-nano
    type: cosmos3
    backends: [cosmos3-nano]
    gpus: [4]
    args: ["--tp", "1"]
  - name: transfer25
    type: transfer25
    backends: [transfer2.5]
    gpus: [5]
  - name: wsm-renderer
    type: wsm_renderer
    backends: [wsm-renderer]
    gpus: [5]
